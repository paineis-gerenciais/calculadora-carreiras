<!doctype html>
<html lang="pt-BR">
<head>

<p id="faixa-tipo" class="faixa faixa-ficticio faixa-fixa" role="note" hidden><span aria-hidden="true">&#9650;</span> <strong>Dados fictícios.</strong> <span id="faixa-detalhe">Todos os dados deste estudo são inventados.</span></p>
<div class="corpo">
  <nav id="menu" class="menu" aria-label="Menu principal">
    <div class="menu-barra">
      <button type="button" id="btn-menu" class="btn-menu" aria-expanded="false" aria-controls="menu-lista"><span aria-hidden="true">&#9776;</span> Menu</button>
